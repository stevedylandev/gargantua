<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
		<title>{{.Title}}</title>
	</head>
	<body>
    <h1>{{.Title}}</h1>
    <p>{{.Content}}</p>
    <ol>
    {{range .Links}}
      <a href='/{{ . }}'>{{ . }}</a>
    {{end}}
    </ol>
	</body>
</html>
