<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
		<title>{{.Title}}</title>
    <style>
      * {
        background: #121113;
        color: white;
        font-family: monospace;
      }

      body {
        max-width: 600px;
        margin: auto;
      }

    </style>
	</head>
	<body>
    <h1>{{.Title}}</h1>
    <p>{{.Content}}</p>
    <ul>
    {{range .Links}}
      <li>
        <a href='/{{ . }}'>{{ . }}</a>
      </li>
    {{end}}
    </ul>
	</body>
</html>
